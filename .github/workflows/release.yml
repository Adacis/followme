name: Publish signed Nextcloud application
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: followme-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  publish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(php -r 'echo simplexml_load_file("appinfo/info.xml")->version;')
          test "${RELEASE_TAG#v}" = "$version"
      - name: Prepare package
        run: |
          make appstore
          mkdir -p "$RUNNER_TEMP/followme-sign"
          tar xzf build/artifacts/appstore/followme.tar.gz -C "$RUNNER_TEMP/followme-sign"
      - name: Sign application and archive
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
        run: |
          set -euo pipefail
          test -n "$APP_PRIVATE_KEY"
          test -n "$APP_CERTIFICATE"
          trap 'rm -f "$RUNNER_TEMP/followme-sign/private.key" "$RUNNER_TEMP/followme-sign/certificate.crt"' EXIT
          umask 077
          printf '%s' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/followme-sign/private.key"
          printf '%s' "$APP_CERTIFICATE" > "$RUNNER_TEMP/followme-sign/certificate.crt"
          docker run --rm --entrypoint php -v "$RUNNER_TEMP/followme-sign:/sign" nextcloud:33-apache /usr/src/nextcloud/occ integrity:sign-app --privateKey=/sign/private.key --certificate=/sign/certificate.crt --path=/sign/followme
          tar czf build/artifacts/appstore/followme.tar.gz -C "$RUNNER_TEMP/followme-sign" followme
          openssl dgst -sha512 -sign "$RUNNER_TEMP/followme-sign/private.key" build/artifacts/appstore/followme.tar.gz | openssl base64 -A > build/artifacts/appstore/shasum.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/artifacts/appstore/followme.tar.gz build/artifacts/appstore/shasum.txt --clobber
      - name: Publish to Nextcloud app store
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: followme
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: https://github.com/Adacis/followme/releases/download/${{ github.ref_name }}/followme.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          nightly: false
